version: "2"
linters:
  default: standard
  enable:
    - gosec
    - misspell
    - bodyclose
    - errorlint
  settings:
    errcheck:
      exclude-functions:
        # Close/Remove on cleanup paths: the primary error is already reported.
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*github.com/matusso/sslknife/internal/sshagent.Client).Close
        - (*crypto/tls.Conn).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*github.com/matusso/sslknife/internal/database.DB).Close
        - os.Remove
        - os.RemoveAll
        # Terminal/diagnostic output: a failed write to stderr cannot be reported anywhere.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G101 # flags environment variable *names* such as SSLKNIFE_PASSWORD
        - G104 # covered by errcheck
        - G304 # reading user-named files is the purpose of a CLI
        - G402 # InsecureSkipVerify: chains are verified separately and reported (tlsinspect)
        - G115 # TLS/ASN.1 integer conversions are bounds-checked explicitly
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose]
      # WHERE fragments are assembled from constant strings by the search
      # compiler; every user value is a bound parameter.
      - path: internal/database/
        linters: [gosec]
        text: G202
