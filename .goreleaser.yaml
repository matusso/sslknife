# GoReleaser configuration: https://goreleaser.com
version: 2
project_name: sslknife

before:
  hooks:
    - go mod tidy
    - go test ./...
    # Shell completions shipped in the deb/rpm packages.
    - sh -c 'mkdir -p completions && for sh in bash zsh fish; do go run . completion "$sh" > "completions/sslknife.$sh"; done'

builds:
  - id: sslknife
    main: .
    binary: sslknife
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/matusso/sslknife/internal/buildinfo.Version={{ .Version }}
      - -X github.com/matusso/sslknife/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/matusso/sslknife/internal/buildinfo.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, docs/*.md]

nfpms:
  - id: packages
    package_name: sslknife
    ids: [sslknife]
    formats: [deb, rpm]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: matusso
    maintainer: Matúš Bursa <https://github.com/matusso>
    homepage: https://github.com/matusso/sslknife
    description: Swiss-army knife for TLS, certificates, PKI and SSH keys
    license: MIT
    section: utils
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/sslknife/LICENSE
      - src: README.md
        dst: /usr/share/doc/sslknife/README.md
      - src: completions/sslknife.bash
        dst: /usr/share/bash-completion/completions/sslknife
      - src: completions/sslknife.zsh
        dst: /usr/share/zsh/vendor-completions/_sslknife
      - src: completions/sslknife.fish
        dst: /usr/share/fish/vendor_completions.d/sslknife.fish

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  # Keyless Sigstore signing of the checksum file (GitHub OIDC in CI).
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]
    artifacts: checksum

dockers:
  - image_templates: ["ghcr.io/matusso/sslknife:{{ .Version }}-amd64"]
    dockerfile: Dockerfile.release
    use: buildx
    build_flag_templates: ["--platform=linux/amd64"]
  - image_templates: ["ghcr.io/matusso/sslknife:{{ .Version }}-arm64"]
    dockerfile: Dockerfile.release
    use: buildx
    goarch: arm64
    build_flag_templates: ["--platform=linux/arm64"]

docker_manifests:
  - name_template: ghcr.io/matusso/sslknife:{{ .Version }}
    image_templates: ["ghcr.io/matusso/sslknife:{{ .Version }}-amd64", "ghcr.io/matusso/sslknife:{{ .Version }}-arm64"]
  - name_template: ghcr.io/matusso/sslknife:latest
    image_templates: ["ghcr.io/matusso/sslknife:{{ .Version }}-amd64", "ghcr.io/matusso/sslknife:{{ .Version }}-arm64"]

brews:
  - name: sslknife
    # A formula (not a cask) so the same tap works on macOS and Linux.
    # Pushed over SSH with a write deploy key of matusso/homebrew-tap; the
    # workflow fails before this point when the HOMEBREW_TAP_DEPLOY_KEY secret is missing.
    repository:
      owner: matusso
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:matusso/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    directory: Formula
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "sslknife {{ .Tag }}"
    homepage: https://github.com/matusso/sslknife
    description: Swiss-army knife for TLS, certificates, PKI and SSH keys
    license: MIT
    test: |
      system "#{bin}/sslknife", "version"
    install: |
      bin.install "sslknife"
      generate_completions_from_executable(bin/"sslknife", "completion")

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]
